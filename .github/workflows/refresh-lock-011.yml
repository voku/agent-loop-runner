name: One-shot 0.1.1 lock refresh

on:
  push:
    branches:
      - release/0.1.1
    paths:
      - .github/workflows/refresh-lock-011.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.1.1
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
      - name: Refresh lock metadata only
        run: |
          composer update --lock --no-install --no-interaction --prefer-dist
          git diff -- composer.lock
      - name: Commit refreshed lock
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore(deps): refresh lock for Loop 0.20 compatibility'
          git push origin HEAD:release/0.1.1
