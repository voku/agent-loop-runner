name: Temporary Loop 0.20.7 lock refresh

on:
  push:
    branches:
      - issue/24-required-host-preflight

permissions:
  contents: write

jobs:
  lock-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: posix
          tools: composer:v2
      - name: Resolve released Loop 0.20.7 and dependencies
        run: composer update voku/agent-loop --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Prove exact released Loop lock
        run: |
          php -r '
          $lock = json_decode(file_get_contents("composer.lock"), true, 512, JSON_THROW_ON_ERROR);
          foreach ($lock["packages"] as $package) {
              if (($package["name"] ?? null) !== "voku/agent-loop") {
                  continue;
              }
              if (($package["version"] ?? null) !== "0.20.7") {
                  fwrite(STDERR, "Expected voku/agent-loop 0.20.7, got " . ($package["version"] ?? "missing") . "\n");
                  exit(1);
              }
              exit(0);
          }
          fwrite(STDERR, "voku/agent-loop missing from generated lock\n");
          exit(1);
          '
      - name: Commit released lock and remove one-shot workflow
        run: |
          rm .github/workflows/lock-refresh-0207.yml
          git add composer.lock .github/workflows/lock-refresh-0207.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore(deps): lock released Loop 0.20.7"
          git push origin HEAD:issue/24-required-host-preflight
