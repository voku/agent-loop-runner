name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - integrate/production-execution-contract-0.18

permissions:
  contents: write

concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  refresh-lock:
    if: github.event_name == 'push' && github.ref == 'refs/heads/integrate/production-execution-contract-0.18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: posix
          tools: composer:v2

      - name: Resolve released agent-loop dependency
        run: composer update voku/agent-loop --with-dependencies --no-interaction --prefer-dist --no-progress

      - name: Commit generated lock when changed
        shell: bash
        run: |
          if git diff --quiet -- composer.lock; then
            echo 'composer.lock already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composer.lock
          git commit -m 'chore: lock released agent-loop 0.18'
          git push origin HEAD:integrate/production-execution-contract-0.18

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: posix
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate package
        run: composer validate --strict

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
