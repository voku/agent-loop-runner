name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: posix
          tools: composer:v2

      - name: Validate package source before released-owner resolution
        run: composer validate --strict

      - name: Resolve released agent-loop owner and dependencies
        run: composer update voku/agent-loop --with-all-dependencies --no-interaction --prefer-dist --no-progress

      - name: Assert exact released agent-loop owner
        run: |
          php -r '
          $json = shell_exec("composer show voku/agent-loop --format=json");
          if (!is_string($json) || trim($json) === "") {
              fwrite(STDERR, "Unable to inspect resolved voku/agent-loop package.\n");
              exit(1);
          }
          $data = json_decode($json, true, 512, JSON_THROW_ON_ERROR);
          $versions = $data["versions"] ?? [];
          $resolved = is_array($versions) && isset($versions[0]) && is_string($versions[0])
              ? ltrim($versions[0], "* ")
              : null;
          if ($resolved !== "0.20.7") {
              fwrite(STDERR, "Expected released voku/agent-loop 0.20.7, got " . var_export($resolved, true) . ".\n");
              exit(1);
          }
          fwrite(STDOUT, "Resolved released voku/agent-loop 0.20.7.\n");
          '

      - name: Lint provider smoke harness
        run: php -l tools/provider-smoke.php

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
