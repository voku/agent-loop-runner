name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: runner-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout exact agent-loop L1-dispatch candidate
        uses: actions/checkout@v6
        with:
          repository: voku/agent-loop
          ref: 0e10f7622dbb7005f61d787234eeb1508f5b1e2f
          path: build/candidate-agent-loop
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: posix
          tools: composer:v2

      - name: Configure exact agent-loop candidate as a compatible path package
        run: |
          php -r '
          $path = "composer.json";
          $data = json_decode(file_get_contents($path), true, 512, JSON_THROW_ON_ERROR);
          $data["repositories"] = [[
              "type" => "path",
              "url" => "build/candidate-agent-loop",
              "options" => ["symlink" => false, "versions" => ["voku/agent-loop" => "0.20.999"]],
          ]];
          file_put_contents($path, json_encode($data, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES | JSON_THROW_ON_ERROR) . PHP_EOL);
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate package
        run: composer validate --strict

      - name: Lint provider smoke harness
        run: php -l tools/provider-smoke.php

      - name: PHPUnit
        run: vendor/bin/phpunit

      - name: PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=512M
