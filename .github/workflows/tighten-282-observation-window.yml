name: Tighten 282 observation window

on:
  push:
    branches:
      - issue-282-current-environment-dispatch

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: issue-282-current-environment-dispatch
          fetch-depth: 0
      - run: python3 .github/scripts/tighten-282-observation-window.py
      - run: |
          git rm .github/scripts/tighten-282-observation-window.py
          git rm .github/workflows/tighten-282-observation-window.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/Execution/ExecutionCoordinator.php
          git commit -m 'fix(execution): reject workspace drift during host probe'
          git push origin HEAD:issue-282-current-environment-dispatch
